<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Survival - Free Online Zombie Game</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}
#game{
    display:block;
    margin:auto;
    background:#263526;
    cursor:crosshair;
}
#info{
    position:fixed;
    top:10px;
    left:10px;
    background:rgba(0,0,0,.7);
    padding:12px 16px;
    border-radius:10px;
    line-height:1.5;
    font-size:16px;
    pointer-events:none;
}
#help{
    position:fixed;
    bottom:10px;
    left:10px;
    background:rgba(0,0,0,.7);
    padding:10px 14px;
    border-radius:8px;
    font-size:14px;
}
#message{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    font-size:42px;
    font-weight:bold;
    text-shadow:3px 3px #000;
    pointer-events:none;
}
</style>
</head>
<body>

<canvas id="game" width="1000" height="650"></canvas>

<div id="info"></div>

<div id="help">
WASD = Move &nbsp; | &nbsp; Mouse = Aim &nbsp; | &nbsp; Hold Left Click = Shoot
<br>
1 = Pistol &nbsp; 2 = Shotgun &nbsp; 3 = Machine Gun &nbsp; R = Reload &nbsp; H = Buy Health
</div>

<div id="message"></div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const info=document.getElementById("info");
const message=document.getElementById("message");

const W=canvas.width;
const H=canvas.height;

const keys={};
const mouse={x:W/2,y:H/2,down:false};

document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;

    if(e.key==="1") weapon=0;
    if(e.key==="2") weapon=1;
    if(e.key==="3") weapon=2;

    if(e.key.toLowerCase()==="r") reload();
    if(e.key.toLowerCase()==="h") buyHealth();

    if(gameOver && e.key.toLowerCase()==="enter"){
        restart();
    }
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

canvas.addEventListener("mousemove",e=>{
    const r=canvas.getBoundingClientRect();
    mouse.x=(e.clientX-r.left)*W/r.width;
    mouse.y=(e.clientY-r.top)*H/r.height;
});

canvas.addEventListener("mousedown",e=>{
    if(e.button===0) mouse.down=true;
});

document.addEventListener("mouseup",e=>{
    if(e.button===0) mouse.down=false;
});

const weapons=[
    {
        name:"Pistol",
        damage:28,
        fireRate:300,
        mag:12,
        ammo:12,
        reload:900,
        speed:850,
        pellets:1,
        spread:.02
    },
    {
        name:"Shotgun",
        damage:15,
        fireRate:650,
        mag:6,
        ammo:6,
        reload:1200,
        speed:760,
        pellets:7,
        spread:.22
    },
    {
        name:"Machine Gun",
        damage:12,
        fireRate:90,
        mag:40,
        ammo:40,
        reload:1500,
        speed:900,
        pellets:1,
        spread:.05
    }
];

let weapon=2;
let player;
let zombies=[];
let bullets=[];
let particles=[];
let wave=1;
let score=0;
let coins=0;
let lives=3;
let gameOver=false;
let waveTimer=0;
let lastShot=0;
let reloading=false;
let reloadEnd=0;
let spawnTimer=0;

function restart(){
    player={
        x:W/2,
        y:H/2,
        hp:100,
        maxHp:100,
        speed:260,
        inv:0
    };

    zombies=[];
    bullets=[];
    particles=[];
    wave=1;
    score=0;
    coins=0;
    lives=3;
    gameOver=false;
    waveTimer=0;
    spawnTimer=0;
    weapon=2;

    weapons.forEach(w=>w.ammo=w.mag);

    message.textContent="";
}

restart();

function distance(a,b){
    return Math.hypot(a.x-b.x,a.y-b.y);
}

function spawnZombie(){
    let side=Math.floor(Math.random()*4);
    let x,y;

    if(side===0){x=-30;y=Math.random()*H}
    if(side===1){x=W+30;y=Math.random()*H}
    if(side===2){x=Math.random()*W;y=-30}
    if(side===3){x=Math.random()*W;y=H+30}

    const boss=wave%5===0 && Math.random()<.12;

    zombies.push({
        x:x,
        y:y,
        hp:boss?180+wave*20:50+wave*8,
        maxHp:boss?180+wave*20:50+wave*8,
        speed:boss?45:65+Math.random()*30,
        size:boss?30:19,
        boss:boss,
        hit:0
    });
}

function shoot(){
    if(gameOver || reloading) return;

    const w=weapons[weapon];
    const now=performance.now();

    if(now-lastShot<w.fireRate) return;

    if(w.ammo<=0){
        reload();
        return;
    }

    lastShot=now;
    w.ammo--;

    const baseAngle=Math.atan2(mouse.y-player.y,mouse.x-player.x);

    for(let i=0;i<w.pellets;i++){
        const angle=baseAngle+(Math.random()-.5)*w.spread;

        bullets.push({
            x:player.x,
            y:player.y,
            vx:Math.cos(angle)*w.speed,
            vy:Math.sin(angle)*w.speed,
            damage:w.damage,
            life:1.2
        });
    }

    for(let i=0;i<3;i++){
        particles.push({
            x:player.x,
            y:player.y,
            vx:(Math.random()-.5)*100,
            vy:(Math.random()-.5)*100,
            life:.15,
            size:4
        });
    }
}

function reload(){
    if(reloading || weapons[weapon].ammo===weapons[weapon].mag) return;

    reloading=true;
    reloadEnd=performance.now()+weapons[weapon].reload;
}

function buyHealth(){
    if(gameOver) return;

    if(coins>=25 && player.hp<player.maxHp){
        coins-=25;
        player.hp=Math.min(player.maxHp,player.hp+40);
    }
}

function hurt(amount){
    if(player.inv>0) return;

    player.hp-=amount;
    player.inv=.5;

    if(player.hp<=0){
        lives--;

        if(lives<=0){
            gameOver=true;
            message.innerHTML="GAME OVER<br><span style='font-size:20px'>Press ENTER to restart</span>";
        }else{
            player.hp=player.maxHp;
            player.x=W/2;
            player.y=H/2;

            zombies=[];
        }
    }
}

function update(dt){
    if(gameOver) return;

    if(reloading && performance.now()>=reloadEnd){
        weapons[weapon].ammo=weapons[weapon].mag;
        reloading=false;
    }

    player.inv=Math.max(0,player.inv-dt);

    let dx=0,dy=0;

    if(keys["w"])dy--;
    if(keys["s"])dy++;
    if(keys["a"])dx--;
    if(keys["d"])dx++;

    if(dx||dy){
        const len=Math.hypot(dx,dy);
        player.x+=dx/len*player.speed*dt;
        player.y+=dy/len*player.speed*dt;
    }

    player.x=Math.max(25,Math.min(W-25,player.x));
    player.y=Math.max(25,Math.min(H-25,player.y));

    if(mouse.down) shoot();

    spawnTimer-=dt;

    const maxZombies=Math.min(45,5+wave*3);

    if(spawnTimer<=0 && zombies.length<maxZombies){
        spawnZombie();
        spawnTimer=Math.max(.25,1.2-wave*.04);
    }

    waveTimer+=dt;

    if(waveTimer>25 && zombies.length===0){
        wave++;
        waveTimer=0;
        player.hp=Math.min(player.maxHp,player.hp+15);

        message.textContent="WAVE "+wave;
        setTimeout(()=>{
            if(!gameOver) message.textContent="";
        },1000);
    }

    for(const b of bullets){
        b.x+=b.vx*dt;
        b.y+=b.vy*dt;
        b.life-=dt;
    }

    bullets=bullets.filter(b=>
        b.life>0 &&
        b.x>-50 && b.x<W+50 &&
        b.y>-50 && b.y<H+50
    );

    for(const z of zombies){
        const d=distance(z,player);

        if(d>1){
            z.x+=(player.x-z.x)/d*z.speed*dt;
            z.y+=(player.y-z.y)/d*z.speed*dt;
        }

        z.hit=Math.max(0,z.hit-dt);

        if(d<z.size+18){
            hurt(z.boss?30:12);
        }
    }

    for(let i=bullets.length-1;i>=0;i--){
        const b=bullets[i];

        for(let j=zombies.length-1;j>=0;j--){
            const z=zombies[j];

            if(distance(b,z)<z.size+5){
                z.hp-=b.damage;
                z.hit=.08;
                bullets.splice(i,1);

                particles.push({
                    x:b.x,
                    y:b.y,
                    vx:(Math.random()-.5)*120,
                    vy:(Math.random()-.5)*120,
                    life:.25,
                    size:5
                });

                if(z.hp<=0){
                    score+=z.boss?500:100;
                    coins+=z.boss?20:5;

                    for(let k=0;k<10;k++){
                        particles.push({
                            x:z.x,
                            y:z.y,
                            vx:(Math.random()-.5)*180,
                            vy:(Math.random()-.5)*180,
                            life:.5,
                            size:Math.random()*5+2
                        });
                    }

                    zombies.splice(j,1);
                }

                break;
            }
        }
    }

    for(const p of particles){
        p.x+=p.vx*dt;
        p.y+=p.vy*dt;
        p.life-=dt;
    }

    particles=particles.filter(p=>p.life>0);
}

function drawBackground(){
    ctx.fillStyle="#263526";
    ctx.fillRect(0,0,W,H);

    ctx.strokeStyle="rgba(255,255,255,.035)";
    ctx.lineWidth=1;

    for(let x=0;x<W;x+=50){
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();
    }

    for(let y=0;y<H;y+=50){
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }

    // buildings
    ctx.fillStyle="#555";
    ctx.fillRect(70,90,170,100);
    ctx.fillRect(760,430,160,110);

    ctx.fillStyle="#777";
    ctx.fillRect(90,110,50,30);
    ctx.fillRect(155,110,50,30);
    ctx.fillRect(780,450,55,30);
    ctx.fillRect(850,450,45,30);

    // trees
    const trees=[
        [320,100],[430,520],[850,120],[180,480],[650,100],
        [720,560],[400,200],[920,280]
    ];

    for(const [x,y] of trees){
        ctx.fillStyle="#68452b";
        ctx.fillRect(x-6,y,12,28);

        ctx.fillStyle="#183d20";
        ctx.beginPath();
        ctx.arc(x,y,27,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="#285b2d";
        ctx.beginPath();
        ctx.arc(x-12,y-10,18,0,Math.PI*2);
        ctx.fill();
    }
}

function drawPlayer(){
    if(player.inv>0 && Math.floor(performance.now()/80)%2===0) return;

    const angle=Math.atan2(mouse.y-player.y,mouse.x-player.x);

    ctx.save();
    ctx.translate(player.x,player.y);
    ctx.rotate(angle);

    ctx.fillStyle="#1e73be";
    ctx.fillRect(-15,-13,30,26);

    ctx.fillStyle="#78c7ff";
    ctx.fillRect(0,-6,28,12);

    ctx.fillStyle="#111";
    ctx.fillRect(18,-4,18,8);

    ctx.restore();
}

function drawZombie(z){
    ctx.save();
    ctx.translate(z.x,z.y);

    ctx.fillStyle=z.boss?"#721c24":"#477a3f";

    ctx.beginPath();
    ctx.arc(0,0,z.size,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#111";
    ctx.beginPath();
    ctx.arc(-6,-5,3,0,Math.PI*2);
    ctx.arc(6,-5,3,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#fff";
    ctx.fillRect(-8,7,16,4);

    ctx.restore();

    // health bar
    ctx.fillStyle="#222";
    ctx.fillRect(z.x-z.size,z.y-z.size-10,z.size*2,5);

    ctx.fillStyle="#e33";
    ctx.fillRect(
        z.x-z.size,
        z.y-z.size-10,
        z.size*2*(z.hp/z.maxHp),
        5
    );
}

function drawBullets(){
    for(const b of bullets){
        ctx.fillStyle="#ffe66d";
        ctx.beginPath();
        ctx.arc(b.x,b.y,3,0,Math.PI*2);
        ctx.fill();
    }
}

function drawParticles(){
    for(const p of particles){
        ctx.globalAlpha=Math.max(0,p.life*2);
        ctx.fillStyle="#ffb347";
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha=1;
}

function draw(){
    drawBackground();
    drawBullets();

    for(const z of zombies) drawZombie(z);

    drawParticles();
    drawPlayer();

    const w=weapons[weapon];

    info.innerHTML=
        "<b>🧟 ZOMBIE SURVIVAL</b><br>"+
        "❤️ HP: "+Math.ceil(player.hp)+"/"+player.maxHp+
        " &nbsp; 💀 Lives: "+lives+
        "<br>"+
        "⭐ Score: "+score+
        " &nbsp; 🪙 Coins: $"+coins+
        "<br>"+
        "🌊 Wave: "+wave+
        " &nbsp; 🔫 "+w.name+
        "<br>"+
        "🔴 Ammo: "+w.ammo+"/"+w.mag+
        (reloading?" — RELOADING...":"")+
        "<br>"+
        "🩹 Health: $25";
}

let last=performance.now();

function loop(now){
    const dt=Math.min(.033,(now-last)/1000);
    last=now;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
